# Static site + Netlify Functions for cloud backup of saved permits.
[build]
  command = "npm install && node scripts/write-storage-secret.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_PATHS = "storage-secret.js"

[functions]
  node_bundler = "esbuild"
