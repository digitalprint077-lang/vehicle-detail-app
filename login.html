<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/clean-url.js"></script>
  <link rel="icon" href="/assets/sindh-emblem.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/sindh-emblem.png">
  <title>Login - Vehicle Detail</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("vehicleDetailTheme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) {
        // ignore storage errors
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-split-page">
  <div class="login-split-bg" aria-hidden="true">
    <span class="login-split-blob login-split-blob-1"></span>
    <span class="login-split-blob login-split-blob-2"></span>
  </div>

  <button type="button" id="theme-toggle-btn" class="login-split-theme-btn theme-toggle-btn" data-theme-toggle aria-label="Switch to night mode" aria-pressed="false">
    <span class="theme-toggle-icon" data-icon="moon" aria-hidden="true"></span>
    <span class="theme-toggle-label">Night</span>
  </button>

  <div class="login-split-wrap">
    <div class="login-split-card">
      <section class="login-split-form-side">
        <p class="login-split-eyebrow">Welcome to</p>

        <div class="login-split-brand">
          <span class="login-split-brand-icon" data-icon="truck" aria-hidden="true"></span>
          <h1 class="login-split-brand-title">Vehicle Detail</h1>
        </div>

        <p class="login-split-lead">Log in to manage route permits, fitness certificates, and public result pages.</p>

        <form id="login-form" class="login-split-form" novalidate>
          <p id="login-error" class="login-split-error hidden">Invalid username or password.</p>

          <div class="login-split-field">
            <div class="login-split-input">
              <span class="login-split-input-icon" data-icon="user" aria-hidden="true"></span>
              <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
            </div>
          </div>

          <div class="login-split-field">
            <div class="login-split-input">
              <span class="login-split-input-icon" data-icon="lock" aria-hidden="true"></span>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required>
              <button type="button" id="password-toggle-btn" class="login-split-password-toggle" aria-label="Show password">
                <span data-icon="eye" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <button type="submit" class="login-split-submit">Sign In</button>
        </form>
      </section>

      <aside class="login-split-showcase" aria-hidden="true">
        <div class="login-split-showcase-bg"></div>
        <div class="login-split-showcase-overlay"></div>
        <div class="login-split-showcase-content">
          <div class="login-split-showcase-brand">
            <span class="login-split-showcase-icon" data-icon="truck" aria-hidden="true"></span>
            <h2>Vehicle Detail</h2>
          </div>
          <p>Your admin workspace for vehicle records, permit previews, fitness certificates, and instant QR result sharing.</p>
        </div>
      </aside>
    </div>
  </div>

  <script src="/config.js?v=6"></script>
  <script src="/auth.js?v=7"></script>
  <script src="/ui-icons.js?v=3"></script>
  <script src="/theme.js?v=3"></script>
  <script src="/login.js?v=3"></script>
</body>
</html>
