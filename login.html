<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/sindh-emblem.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/sindh-emblem.png">
  <title>Login - Vehicle Detail</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("vehicleDetailTheme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) {
        // ignore storage errors
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="panel.css?v=29">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="panel-page login-page">
  <main class="page">
    <header class="panel-topbar">
      <div class="panel-brand">
        <span class="panel-eyebrow">Secure Access</span>
        <h1 class="page-title">Vehicle Detail</h1>
      </div>
      <div class="panel-topbar-actions">
        <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" data-theme-toggle aria-label="Switch to night mode" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">&#9790;</span>
          <span class="theme-toggle-label">Night</span>
        </button>
      </div>
    </header>

    <section class="panel-card form-card">
      <div class="panel-card-header">
        <h2 class="card-title">Login</h2>
        <span class="panel-badge">Panel</span>
      </div>

      <form id="login-form" class="vehicle-form" novalidate>
        <p id="login-error" class="login-error hidden">Invalid username or password.</p>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="submit-btn">Login</button>
      </form>
    </section>
  </main>

  <script src="config.js?v=3"></script>
  <script src="auth.js?v=4"></script>
  <script src="theme.js?v=1"></script>
  <script src="login.js?v=2"></script>
</body>
</html>
