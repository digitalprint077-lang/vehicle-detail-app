<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/clean-url.js"></script>
  <link rel="icon" href="/assets/sindh-emblem.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/sindh-emblem.png">
  <title>Login - Vehicle Detail</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("vehicleDetailTheme");
        if (theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) {
        // ignore storage errors
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login.css?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-split-page">
  <div class="login-split-wrap">
    <div class="login-split-card">
      <aside class="login-split-showcase">
        <div class="login-split-showcase-content">
          <div class="login-split-showcase-brand">
            <img class="login-split-emblem" src="/assets/sindh-emblem.png" alt="">
            <p class="login-split-eyebrow">Sindh transport desk</p>
            <h2>Vehicle Detail</h2>
          </div>
          <ul class="login-split-points">
            <li>Route permits and A4 print</li>
            <li>Fitness certificates</li>
            <li>Saved records and cloud backup</li>
          </ul>
        </div>
        <button type="button" id="theme-toggle-btn" class="login-split-theme-btn theme-toggle-btn" data-theme-toggle aria-label="Switch to night mode" aria-pressed="false">
          <span class="theme-toggle-icon" data-icon="moon" aria-hidden="true"></span>
          <span class="theme-toggle-label">Night</span>
        </button>
      </aside>

      <section class="login-split-form-side">
        <p class="login-split-eyebrow">Admin sign in</p>
        <div class="login-split-brand">
          <h1 class="login-split-brand-title">Welcome back</h1>
        </div>
        <p class="login-split-lead">Use your admin username and password to open the workspace.</p>

        <form id="login-form" class="login-split-form" novalidate>
          <p id="login-error" class="login-split-error hidden">Invalid username or password.</p>

          <div class="login-split-field">
            <label for="username">Username</label>
            <div class="login-split-input">
              <span class="login-split-input-icon" data-icon="user" aria-hidden="true"></span>
              <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
            </div>
          </div>

          <div class="login-split-field">
            <label for="password">Password</label>
            <div class="login-split-input">
              <span class="login-split-input-icon" data-icon="lock" aria-hidden="true"></span>
              <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Password" required>
              <button type="button" id="password-toggle-btn" class="login-split-password-toggle" aria-label="Show password">
                <span data-icon="eye" aria-hidden="true"></span>
              </button>
            </div>
          </div>

          <button type="submit" class="login-split-submit">Sign in</button>
        </form>
      </section>
    </div>
  </div>

  <script src="/config.js?v=6"></script>
  <script src="/auth.js?v=8"></script>
  <script src="/ui-icons.js?v=3"></script>
  <script src="/theme.js?v=3"></script>
  <script src="/login.js?v=4"></script>
</body>
</html>
