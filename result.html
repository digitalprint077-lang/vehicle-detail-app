<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/sindh-emblem.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/sindh-emblem.png">
  <title>Route Permit</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dotted-bg result-page-body">
  <div id="custom-cursor" class="custom-cursor hidden" aria-hidden="true">
    <div class="cursor-dot"></div>
  </div>
  <div id="cursor-ring" class="cursor-ring hidden" aria-hidden="true"></div>

  <main class="result-page">
    <h1 class="page-title">Vehicle Detail</h1>
    <section class="card result-card">
      <h2 class="card-title">Route Permit</h2>
      <dl class="result-list">
        <div class="result-row">
          <dt>Registration#:</dt>
          <dd id="result-registration">-</dd>
        </div>
        <div class="result-row">
          <dt>Chassis#:</dt>
          <dd id="result-chassis">-</dd>
        </div>
        <div class="result-row">
          <dt>Engine#:</dt>
          <dd id="result-engine">-</dd>
        </div>
        <div class="result-row">
          <dt>Issue Date:</dt>
          <dd id="result-issue-date">-</dd>
        </div>
        <div class="result-row">
          <dt>Expiry Date:</dt>
          <dd id="result-expiry-date">-</dd>
        </div>
        <div class="result-row">
          <dt>Status:</dt>
          <dd id="result-status" class="status-value">-</dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="cursor.js?v=3"></script>
  <script src="result.js?v=2"></script>
</body>
</html>
